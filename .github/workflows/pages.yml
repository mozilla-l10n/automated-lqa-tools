name: Publish reports

# Reports only reach `main` when a QA pull request is merged, so that is
# when the site should rebuild. Path-filtered so unrelated commits to lib/
# or state/ do not trigger a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'site/**'
      - '*/config.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# The Pages permissions belong to `deploy` alone -- `build` only reads the
# tree and uploads an artifact.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Only the site build needs a markdown renderer; the QA pipeline does
      # not, so it stays out of requirements.txt.
      - run: pip install 'markdown~=3.7' PyYAML

      - name: Build the site
        run: python site/build.py

      - name: Check the dropdown logic
        run: node site/selftest.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Uploads _site/ only: the repository carries 24 MB of pipeline state
      # that has no business being published.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
