name: Publish reports

# Reports only reach `main` when a QA pull request is merged, so that is
# when the site should rebuild. Path-filtered so unrelated commits to lib/
# or state/ do not trigger a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'site/**'
      - '*/config.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Read the repository, mint a Pages deployment. Nothing writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; let a newer one win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Only the site build needs a markdown renderer; the QA pipeline does
      # not, so it stays out of requirements.txt.
      - run: pip install 'markdown~=3.7' PyYAML

      - name: Build the site
        run: python site/build.py

      - name: Check the dropdown logic
        run: node site/selftest.mjs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Uploads _site/ only: the repository carries 24 MB of pipeline state
      # that has no business being published.
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
