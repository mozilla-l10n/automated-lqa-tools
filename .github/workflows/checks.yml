name: Checks

# Runs on every pull request and every push to main. Deliberately cheap and
# hermetic: no API key, no upstream clone, nothing written anywhere.
#
# The three project self-tests are not here, and cannot be. They pin real
# defects against real strings -- that is what makes them worth having -- so
# they need firefox-l10n, android-l10n and firefoxios-l10n on disk, and
# firefox-l10n alone is 1.6 GB. What runs here is `lib/selftest_unit.py`,
# which is the part of the same body of tests that needs no clone: finding
# identity, the lifecycle, suppression, the model-response parser, the
# snapshot delta, and the markdown the published site is built from.
#
# Run the project suites locally before changing anything in lib/:
#
#   .venv/bin/python firefox/tools/selftest.py
#   .venv/bin/python android/tools/selftest.py
#   .venv/bin/python firefox_ios/tools/selftest.py
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install 'markdown~=3.7' ruff

      - name: Lint
        run: ruff check .

      - name: Everything compiles
        run: python -m compileall -q lib site */tools

      - name: Clone-free regression tests
        run: python lib/selftest_unit.py

      - name: The site builds
        # Default --out, because the dropdown test below reads _site/ off
        # disk. Built somewhere else, it finds nothing and fails obscurely.
        run: python site/build.py

      - name: Dropdown logic
        run: node site/selftest.mjs
