name: Firefox iOS l10n QA

# Separate from the other workflows on purpose: different reviewers, a
# different repository, and its own pull request on l10n-qa/firefox_ios, so
# no team has to read another's findings.
#
# Weekly rather than daily: findings are a backlog a locale team works
# through over weeks, and the pull request is cumulative anyway. The three
# projects are staggered because they share one API key and one runner pool.
on:
  workflow_dispatch:
    inputs:
      locales:
        description: 'Comma-separated locale codes, or "all"'
        required: false
        default: 'all'
      mode:
        description: 'auto = baseline for a new locale, incremental otherwise'
        required: false
        default: 'auto'
        type: choice
        options: [auto, incremental, baseline]
      dry_run:
        description: 'Run everything but write nothing'
        required: false
        default: false
        type: boolean
      no_llm:
        description: 'Deterministic checks only; no API calls'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '25 7 * * 1'   # Monday, 07:25 UTC

concurrency:
  # Runs push to a shared branch, so never let two overlap.
  group: firefox-ios-l10n-qa
  cancel-in-progress: false

# Read-only by default. A job-level block replaces this one rather than
# adding to it, so nothing here can widen a job that does not ask.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      locales: ${{ steps.pick.outputs.locales }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - id: pick
        name: Resolve the locale list
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, yaml
          requested = os.environ["REQUESTED"].strip()
          config = yaml.safe_load(open("firefox_ios/config.yaml"))
          known = config["locales"]
          if not requested or requested == "all":
              picked = known
          else:
              picked = [x.strip() for x in requested.split(",") if x.strip()]
              unknown = [x for x in picked if x not in known]
              if unknown:
                  raise SystemExit(
                      f"not in firefox_ios/config.yaml: {', '.join(unknown)}"
                  )
          print("locales=" + json.dumps(picked))
          PY
        env:
          REQUESTED: ${{ inputs.locales || 'all' }}

  review:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 180
    strategy:
      # One locale per job so a single failure cannot take the rest down, and
      # so a slow baseline does not block the incremental runs.
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: ${{ fromJson(needs.plan.outputs.locales) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache the upstream clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work
          # Keyed by project as well as locale: every workflow caches the
          # same `work` path, and an unnamespaced key let the android run's
          # clone be restored here and fetched as if it were this one.
          key: repos-firefox_ios-${{ matrix.locale }}-${{ github.run_id }}
          restore-keys: |
            repos-firefox_ios-${{ matrix.locale }}-

      - name: Check out firefoxios-l10n
        # One XLIFF per locale, source and target inside it, so there is no
        # second repository and nothing to sparse-check-out. History is
        # heavy -- 104 large XML files churned twice weekly for years --
        # hence blobless and depth 1.
        run: |
          set -euo pipefail
          # Reuse the restored clone only if it is actually this repository.
          # A cache holding some other tree must be discarded, not fetched
          # into: the run would otherwise succeed against the wrong strings.
          if [ -d work/l10n/.git ] && \
             [ "$(git -C work/l10n remote get-url origin)" \
               != "https://github.com/mozilla-l10n/firefoxios-l10n" ]; then
            echo "cached work/l10n is not firefoxios-l10n; discarding it"
            rm -rf work/l10n
          fi
          if [ -d work/l10n/.git ]; then
            git -C work/l10n fetch --depth 1 origin main
            git -C work/l10n reset --hard origin/main
          else
            git clone --depth 1 --filter=blob:none \
              https://github.com/mozilla-l10n/firefoxios-l10n work/l10n
          fi
          du -sh work/l10n

      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python lib/run.py --project firefox_ios \
            --locale '${{ matrix.locale }}' \
            --mode '${{ inputs.mode || 'auto' }}' \
            --l10n-dir work/l10n \
            --source-dir work/l10n \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.no_llm && '--no-llm' || '' }} \
            < /dev/null

      - name: Upload this locale's state and report
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-${{ matrix.locale }}
          path: |
            firefox_ios/state/${{ matrix.locale }}/
            reports/${{ matrix.locale }}/firefox_ios.md
            firefox_ios/locales/${{ matrix.locale }}/
          if-no-files-found: ignore
          retention-days: 7

  propose:
    needs: review
    # Propose whatever succeeded, even if some locales failed.
    if: ${{ always() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: l10n-qa/firefox_ios
      BASE: ${{ github.ref_name }}
      # A push or pull request made with GITHUB_TOKEN cannot start a workflow
      # run, so `Checks` on the QA pull request sits at "action_required"
      # until somebody approves it by hand. No setting lifts that; the actor
      # has to be something other than github-actions[bot]. QA_PR_TOKEN is a
      # fine-grained PAT with contents:write and pull-requests:write on this
      # repository alone. It falls back to github.token so a run still
      # proposes its findings when the secret is missing or expired.
      GH_TOKEN: ${{ secrets.QA_PR_TOKEN || github.token }}
    steps:
      - name: Say which identity is proposing
        # Tested through the environment, not interpolated into the script:
        # a secret pasted into a shell line is one quote away from being a
        # syntax error.
        env:
          HAVE_PAT: ${{ secrets.QA_PR_TOKEN != '' }}
        run: |
          if [ "$HAVE_PAT" = 'true' ]; then
            echo "proposing as the QA_PR_TOKEN owner; the PR's checks will run"
          else
            echo "::warning::QA_PR_TOKEN is not set; falling back to GITHUB_TOKEN. The pull request is still opened, but its checks will need approving by hand."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Kept for the `git push` below, which reuses this credential.
          token: ${{ secrets.QA_PR_TOKEN || github.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Switch to the rolling QA branch
        # One long-lived branch, so runs accumulate into a single open pull
        # request instead of opening one per run. Done before the artifacts
        # are applied so there is nothing in the tree to stash.
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if ! git merge --no-edit "origin/$BASE"; then
              # Only generated files can conflict. Locale instructions are
              # human-edited, so the base wins those; state and reports are
              # rewritten by this run anyway, so the branch keeps them.
              git checkout --theirs -- firefox_ios/locales 2>/dev/null || true
              git checkout --ours   -- firefox_ios/state reports 2>/dev/null || true
              git add -A
              git commit --no-edit
            fi
          else
            git checkout -B "$BRANCH"
          fi

      - name: Collect the per-locale results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-*
          merge-multiple: true
          path: incoming

      - name: Apply them
        run: |
          set -euo pipefail
          if [ ! -d incoming ]; then
            echo "no artifacts produced; nothing to propose"
            exit 0
          fi
          # upload-artifact roots each artifact at the common ancestor of the
          # paths it was given. Those are now `firefox_ios/state`, `firefox_ios/locales`
          # and `reports/`, which diverge at the top, so the artifact carries
          # full workspace-relative paths and unpacks at the root.
          cp -R incoming/. ./
          rm -rf incoming

      - name: Refresh the cross-locale summary
        run: python lib/summary.py --project firefox_ios

      - name: Commit
        id: commit
        run: |
          set -euo pipefail
          git add firefox_ios/state reports firefox_ios/locales
          if git diff --cached --quiet; then
            echo "no changes: every locale is where it was"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Firefox iOS l10n QA: ${INPUTS_LOCALES} ($(date -u +%Y-%m-%d))"
          git push --force-with-lease origin "$BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
        env:
          INPUTS_LOCALES: ${{ inputs.locales || 'all' }}

      - name: Open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          INPUTS_LOCALES: ${{ inputs.locales || 'all' }}
        run: |
          set -euo pipefail
          # Generated, not sliced out of the rendered page, so an edit to
          # that page cannot quietly change what a reviewer sees.
          python lib/summary.py --project firefox_ios --pr-body > /tmp/pr-body.md

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --body-file /tmp/pr-body.md
            gh pr comment "$BRANCH" \
              --body "Refreshed $(date -u +%Y-%m-%d) — locales: \`${INPUTS_LOCALES}\`"
          else
            gh pr create \
              --base "$BASE" --head "$BRANCH" \
              --title "Firefox for iOS l10n QA" \
              --body-file /tmp/pr-body.md
          fi
          gh pr view "$BRANCH" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize the run
        run: |
          {
            echo '## Firefox iOS l10n QA'
            echo
            sed -n '1,40p' reports/firefox_ios.md
          } >> "$GITHUB_STEP_SUMMARY"
