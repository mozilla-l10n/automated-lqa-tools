# Firefox l10n QA configuration.
project: firefox
name: Firefox (desktop + shared toolkit/dom strings)

repos:
  # Localized strings: one top-level directory per locale.
  l10n:
    url: https://github.com/mozilla-l10n/firefox-l10n
    branch: main
    # Locale trees live directly at <root>/<locale>/
    locale_path: "{locale}"
  # en-US reference with matching relative paths (the "source"/quarantine repo).
  source:
    url: https://github.com/mozilla-l10n/firefox-l10n-source
    branch: main
    locale_path: ""

# File extensions to parse. .dtd is gone from this project.
extensions: [".ftl", ".properties", ".ini"]

# Paths (relative to a locale tree) excluded from every check and review.
exclude:
  - "extensions/spellcheck/**"      # hunspell dictionaries, not translations
  - "**/*.dic"
  - "**/*.aff"

llm:
  model: claude-opus-5
  # Incremental reviews batch this many strings per request.
  batch_size: 40
  max_output_tokens: 16000
  # Baseline (from-scratch) reviews run headless `claude` per partition.
  baseline_model: claude-opus-5
  baseline_timeout_seconds: 3600

# Locales that are variants of the source language rather than
# translations of it. Most of their strings are identical to en-US and
# correct, so the usual "identical means untranslated" rule is inverted:
# identical strings are reviewed rather than skipped, and the interesting
# defect is a string that failed to diverge. See tools/variants.py.
variants:
  en-GB: en-US
  en-CA: en-US

# Locales checked by this project. Adding a code here triggers a full
# from-scratch baseline on the next run (see docs/adding-a-locale.md).
locales:
  - cs
  - de
  - en-CA
  - en-GB
  - es-AR
  - es-ES
  - es-MX
  - fr
  - fy-NL
  - hu
  - id
  - it
  - ja
  - nl
  - pl
  - pt-BR
  - ru
  - sl
  - tr
  - zh-CN

# Checks this project runs, in report order. Shared ones come from
# lib/common_checks.py; term_params, accesskey and markup are Fluent-specific
# and defined in tools/checks.py.
checks:
  - variables
  - selectors
  - term_params
  - plurals
  - accesskey
  - markup
  - typography
  - variant_spelling

# Deterministic checks that are meaningless for some locales or paths.
check_overrides:
  # Access keys are not adapted in CJK locales: the platform appends "(W)".
  accesskey:
    skip_locales: [ja, zh-CN, zh-TW, ko]
  # Files that are legitimately byte-identical to en-US in every locale:
  # brand names and keyboard shortcut definitions.
  untranslated:
    skip_paths:
      - "browser/branding/*/brand.properties"
      - "devtools/startup/key-shortcuts.ftl"
      - "toolkit/chrome/global-platform/**"
  typography:
    skip_paths:
      # NSIS installer strings wrap values in straight quotes as syntax, and
      # use "..." and $\n escapes that are not prose typography.
      - "browser/installer/**"

# A check that fires on more strings than this in one locale is reported as a
# single systemic decision listing the affected IDs, not as N separate
# findings. Unadapted access keys and a house quote style are choices for the
# locale team to make once, not hundreds of bugs.
systemic_threshold: 25
