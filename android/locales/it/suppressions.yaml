# Suppressions for it
#
# Every rule needs an `id` and a `reason`. Conditions inside `match` are
# ANDed. `string_id` and `file` accept a trailing `*` or a `re:` prefix;
# `text` is a case-insensitive substring of the finding.
#
# Rules are re-applied to the whole backlog on every run, so adding one here
# retires matching findings that were raised in the past too. Nothing is
# deleted -- suppressed findings move to the report appendix with the rule id
# next to them.
#
# Prefer writing locale knowledge as prose in conventions.md when you can:
# that stops the finding being raised at all, instead of filtering it after.

rules:
  - id: it-final-exclamation
    reason: >-
      Ending a sentence with `.` where the source ends with `!` is a
      deliberate register choice; Italian UI text uses the exclamation mark
      far more sparingly than English. Scoped to typography findings so a
      real punctuation defect in the same string still reports.
    match:
      category: 'E'
      text: 'exclamation'
  - id: it-crittare
    reason: >-
      `crittare` and its forms (`critta`, `crittato`) are the correct Italian
      verb for "to encrypt" — not a typo for `criptare`. Confirmed by the
      maintainer. Scoped to spelling findings so a mistranslation in the same
      string still reports.
    match:
      category: 'C'
      text: 'critt'
