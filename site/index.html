<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Localization QA reports</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="bar">
    <h1><a href="#/all/firefox">Localization QA</a></h1>
    <label for="locale">Locale</label>
    <select id="locale" aria-label="Locale"></select>
    <label for="project">Project</label>
    <select id="project" aria-label="Project"></select>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
</header>
<main id="report" tabindex="-1">
  <p class="placeholder">Loading…</p>
</main>
<footer>
  <p>Generated by
     <a href="https://github.com/mozilla-l10n/automated-lqa-tools">automated-lqa-tools</a>.
     Reports are rebuilt when a QA pull request is merged.
     <span id="generated"></span></p>
</footer>
<script src="app.js"></script>
</body>
</html>
