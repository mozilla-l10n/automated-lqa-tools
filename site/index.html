<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The reports quote real translations, and a report fragment is injected
     with innerHTML. build.py escapes the source and drops any link target
     outside an allowlist; this is the layer that does not depend on either
     being right. No inline or remote script, and no remote image, so a
     payload that did slip through can neither run nor phone home. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self';
               img-src 'self' data:; connect-src 'self'; base-uri 'none';
               form-action 'none'; frame-ancestors 'none'">
<title>Localization QA reports</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="bar">
    <h1><a href="#/all/firefox">Localization QA</a></h1>
    <label for="locale">Locale</label>
    <select id="locale" aria-label="Locale"></select>
    <label for="project">Project</label>
    <select id="project" aria-label="Project"></select>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
</header>
<main id="report" tabindex="-1">
  <p class="placeholder">Loading…</p>
</main>
<footer>
  <p>Generated by
     <a href="https://github.com/mozilla-l10n/automated-lqa-tools">automated-lqa-tools</a>.
     Reports are rebuilt when a QA pull request is merged.
     <span id="generated"></span></p>
</footer>
<script src="app.js"></script>
</body>
</html>
