# Focus for Android l10n QA configuration.
project: focus_android
name: Firefox Focus for Android
display_name: Focus for Android

# Same repository and same layout as Firefox for Android (android/): source
# and every locale side by side as res/values/ and res/values-<code>/, mapped
# by a compare-locales TOML config that moz.l10n reads directly.
layout: android

configs:
  - focus.toml     # focus-android

# Read, never checked: those strings belong to Firefox for Android.
#
# Conventions are counted over both trees. Focus is a few hundred strings,
# and measured alone 25 of its locales inferred a different convention from
# the rest of their tree, from as few as one occurrence -- one curly single
# quote made en-GB "curly-single" against Firefox for Android's thousands of
# double quotes. The same team translates both, so the larger count is what
# the locale does.
#
# A quoted label may name an Android Components string: Focus is built on
# that library, but not on Fenix, so only that part of firefox.toml is
# offered to `ui_references` as something a label can point at.
context:
  conventions: [firefox.toml]
  conventions_from: Firefox for Android
  references:
    configs: [firefox.toml]
    paths: ["mozilla-mobile/android-components/"]

repos:
  l10n:
    url: https://github.com/mozilla-l10n/android-l10n
    branch: main
    locale_path: ""
  # The same repository is its own reference: res/values/ is the source.
  source:
    url: https://github.com/mozilla-l10n/android-l10n
    branch: main
    locale_path: ""

extensions: [".xml"]

exclude: []

llm:
  model: claude-opus-5-5
  # Explicit because Opus 5.5's default is `medium`, where Opus 5 ran at
  # `high`. Read by the incremental reviewer and the auto-suggest fixer.
  effort: medium
  batch_size: 40
  max_output_tokens: 16000
  baseline_model: claude-opus-5-5
  baseline_timeout_seconds: 3600

# Checks this project runs, in report order. See tools/checks.py for the
# ones deliberately absent: Focus has no <plurals>, so `plurals` and
# `selectors` could never fire. `variables` is off for the same reason as
# in android/config.yaml.
checks:
  - placeholders
  - escaping
  - markup
  - ui_references
  - typography
  - variant_spelling

check_overrides: {}

systemic_threshold: 25

# Batched like Firefox for Android, so a from-scratch review of the two
# projects reads the same way. Focus is one strings.xml small enough for an
# agent as well; --baseline-strategy agent uses the single partition below.
baseline: batched

partitions:
  - name: focus
    paths: ["mozilla-mobile/focus-android/"]

# Locales that are variants of the source language rather than
# translations of it. See lib/variants.py.
variants:
  en-GB: en-US
  en-CA: en-US

# Firefox for Android's list minus pt-PT, which focus-android/l10n.toml
# does not ship.
locales:
  - ar
  - cs
  - de
  - el
  - en-CA
  - en-GB
  - es-AR
  - es-ES
  - es-MX
  - fa
  - fi
  - fr
  - fy-NL
  - hi-IN
  - hu
  - id
  - it
  - ja
  - ko
  - nl
  - pl
  - pt-BR
  - ro
  - ru
  - sk
  - sl
  - sv-SE
  - th
  - tr
  - uk
  - vi
  - zh-CN
  - zh-TW

# Where these strings live in Pontoon, for lib/suggest.py.
pontoon:
  projects:
    - slug: focus-for-android
      paths: ["mozilla-mobile/focus-android/*"]
